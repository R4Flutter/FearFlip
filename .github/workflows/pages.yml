name: Deploy to GitHub Pages

# Every push to main rebuilds the web game and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - run: flutter pub get

      - run: bash tool/build_pages.sh

      - name: Publish to gh-pages
        working-directory: build/pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
