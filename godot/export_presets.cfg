html/head_include="<script src='https://sdk.crazygames.com/crazygames-sdk-v3.js'></script>
<script>
// FearFlip x CrazyGames (plans/06 P9; scripts/portal.gd): the SDK must finish init before the game reads its cloud saves.
window.fearflipSdk = { ready: false, leaderboardKey: '' };
if (window.CrazyGames && window.CrazyGames.SDK) {
	window.CrazyGames.SDK.init().then(function () {
		window.fearflipSdk.ready = window.CrazyGames.SDK.environment !== 'disabled';
	}).catch(function () {});
}
// The Abyss leaderboard (invited games only): paste the base64 key from the CrazyGames developer portal into
// leaderboardKey above. The score goes as AES-GCM(iv 12 bytes + ciphertext, base64) next to the plain score.
window.fearflipSubmitDepth = async function (depth) {
	var key = window.fearflipSdk.leaderboardKey;
	if (!key || !window.fearflipSdk.ready) return;
	var raw = Uint8Array.from(atob(key), function (c) { return c.charCodeAt(0); });
	var aes = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
	var iv = crypto.getRandomValues(new Uint8Array(12));
	var sealed = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, aes, new TextEncoder().encode(String(depth))));
	var out = new Uint8Array(iv.length + sealed.length);
	out.set(iv);
	out.set(sealed, iv.length);
	window.CrazyGames.SDK.user.submitScore({ encryptedScore: btoa(String.fromCharCode.apply(null, out)), score: depth });
};
</script>"
html/canvas_resize_policy=2
